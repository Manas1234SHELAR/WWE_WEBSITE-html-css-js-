/* Shared navigation: identical dimensions and alignment on every page */
.site-navbar, .site-navbar * { box-sizing: border-box; }
.site-navbar {
  --nav-bg: #080808;
  --nav-accent: #e10600;

  top: 0;

  align-items: center;

.site-brand {

.site-nav-links {

}
.site-nav-links > a,
.site-dropdown-toggle {
  display: inline-flex;
  align-items: center;

  letter-spacing: .55px;
  text-transform: uppercase;
  text-decoration: none;
  white-space: nowrap;

  transition: color .18s ease;
}
.site-nav-links > a:hover,
.site-dropdown-toggle:hover,
.site-nav-links > a:focus-visible,
.site-dropdown-toggle:focus-visible { color: #ff3434; outline-offset: 4px; }
.site-nav-links .site-nav-cta,

.site-nav-links .site-nav-signin:hover { border-color: #e10600; color: #ff3434; }
.site-dropdown { position: relative; display: flex; align-items: center; }
.site-dropdown-menu {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  left: -12px;
  min-width: 165px;
  padding: 7px;
  border: 1px solid #303030;
  border-radius: 7px;
  background: #111;
  box-shadow: 0 12px 28px rgba(0,0,0,.4);
}
.site-dropdown:hover .site-dropdown-menu,
.site-dropdown:focus-within .site-dropdown-menu,
.site-dropdown.is-open .site-dropdown-menu { display: block; }
.site-dropdown-menu a {
  display: block;
  padding: 11px 12px;
  border-radius: 4px;
  color: #f5f5f5;
  font: 600 13px Arial, sans-serif;
  text-decoration: none;

<script id="professional-responsive-navigation-js">
document.addEventListener('DOMContentLoaded', function () {
  const nav = document.querySelector('.site-navbar');
  if (!nav) return;
  const menuButton = nav.querySelector('.site-menu-toggle');
  const dropdown = nav.querySelector('.site-dropdown');
  const dropdownButton = nav.querySelector('.site-dropdown-toggle');

  menuButton.addEventListener('click', function () {
    const open = nav.classList.toggle('menu-open');
    menuButton.setAttribute('aria-expanded', String(open));
    menuButton.setAttribute('aria-label', open ? 'Close navigation menu' : 'Open navigation menu');
  });

  dropdownButton.addEventListener('click', function () {
    const open = dropdown.classList.toggle('is-open');
    dropdownButton.setAttribute('aria-expanded', String(open));
  });

  document.addEventListener('click', function (event) {
    if (!nav.contains(event.target)) {
      nav.classList.remove('menu-open');
      menuButton.setAttribute('aria-expanded', 'false');
      dropdown.classList.remove('is-open');
      dropdownButton.setAttribute('aria-expanded', 'false');
    }
  });
});
</script>
